name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Assemble module zip
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK=$APK"
          mkdir -p out/system/app/CatGirl
          cp "$APK" out/system/app/CatGirl/CatGirl.apk
          cp module.prop out/
          cp customize.sh out/
          cp service.sh out/
          cp -r webroot out/
          mkdir -p out/META-INF/com/google/android
          cp META-INF/com/google/android/* out/META-INF/com/google/android/
          cd out && zip -r ../CatGirlModule.zip . >/dev/null
          cd .. && ls -lh CatGirlModule.zip && unzip -l CatGirlModule.zip | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: CatGirlModule
          path: CatGirlModule.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CatGirlModule.zip
          generate_release_notes: true
